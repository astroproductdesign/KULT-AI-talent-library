<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KULT AI Talent Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            wf: {
              canvas:        '#ffffff',
              ink:           '#080808',
              'ink-strong':  '#222222',
              body:          '#363636',
              'body-mid':    '#5a5a5a',
              mute:          '#898989',
              'mute-soft':   '#ababab',
              hairline:      '#d8d8d8',
              purple:        '#7a3dff',
              pink:          '#ed52cb',
              blue:          '#3b89ff',
              'blue-deep':   '#006acc',
              'blue-info':   '#146ef5',
              orange:        '#ff6b00',
              green:         '#00d722',
              yellow:        '#ffae13',
              red:           '#ee1d36',
            }
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
          },
          boxShadow: {
            'wf-2': '0 84px 24px rgba(0,0,0,0), 0 54px 22px rgba(0,0,0,0.01), 0 30px 18px rgba(0,0,0,0.04), 0 13px 13px rgba(0,0,0,0.08), 0 3px 7px rgba(0,0,0,0.09)',

          },
          borderRadius: {
            'wf-sm': '4px',
            'wf-md': '8px',
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #ffffff;
      color: #080808;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f5f5f5;
    }
    ::-webkit-scrollbar-thumb {
      background: #d8d8d8;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #ababab;
    }
  </style>
  </head>
<body>
  <div id="root"></div>
  <script type="module" src="./index.tsx"></script>
</body>
</html>
